services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Without an API key the rule-based demo model runs, so `docker compose up` always works.
      TRUSTDESK_PROVIDER: ${TRUSTDESK_PROVIDER:-fake}
    volumes:
      - trustdesk-data:/app/data
volumes:
  trustdesk-data:
