# Free and local: the app talks to Ollama running on your machine (GPU-accelerated on macOS).
# Without Ollama: TRUSTDESK_PROVIDER=fake docker compose up   (rule-based demo, not an LLM)
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      TRUSTDESK_PROVIDER: ${TRUSTDESK_PROVIDER:-ollama}
      TRUSTDESK_OLLAMA_URL: ${TRUSTDESK_OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - trustdesk-data:/app/data
volumes:
  trustdesk-data:
