[project]
name = "trustdesk"
version = "0.1.0"
description = "A policy-bound customer-support agent with human approval, measured prompt-injection defenses and a tau-bench-style eval harness."
authors = [
    { name = "Varad Rajiv Pandare", email = "varadpandare.24@kgpian.iitkgp.ac.in" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1,<3",
    "faker>=40",
    "fastapi>=0.161",
    "fastembed>=0.9,<0.10",
    "httpx>=0.28",
    "langgraph>=1.2.16,<1.3",
    "langgraph-checkpoint-sqlite>=3.1",
    "matplotlib>=3.11",
    "numpy>=2",
    "pydantic>=2.14",
    "python-dotenv>=1",
    "pyyaml>=6",
    "rank-bm25==0.2.2",
    "typer>=0.27",
    "uvicorn>=0.54",
]

[project.optional-dependencies]
langfuse = [
    "langfuse>=5.0,<6",
]

[project.scripts]
trustdesk = "trustdesk.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trustdesk", "evals"]

[dependency-groups]
dev = [
    "hypothesis>=6.170",
    "mypy",
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "real_model: calls a paid model API; excluded from CI (run with -m real_model)",
    "slow: downloads or loads the local embedding model",
]
addopts = "-m 'not real_model and not slow'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM118", "E731", "B023"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
